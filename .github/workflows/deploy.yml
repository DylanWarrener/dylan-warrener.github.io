# .github/workflows/deploy.yml
name: Build & Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout + preserve credentials for pushing
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # 2) Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3) Install & QA
      - name: Install dependencies
        run: npm install

      - name: Format code (Prettier)
        run: npm run format

      - name: Lint code (ESLint)
        run: npm run lint

      # 4) Generate static site into `docs/`
      - name: Build static site
        run: npm run generate
        env:
          NODE_ENV: production
        # nuxt generate prerenders your routes into plain HTML files under `docs/` by default :contentReference[oaicite:0]{index=0}

      # 5) Move generated files into repo root so Pages will serve from /
      - name: Move generated site to root
        run: |
          # Copy every file (including hidden) from docs/ to the checkout root
          shopt -s dotglob       # include hidden files like .nojekyll
          cp -R docs/* ./

      # 6) Commit & push back to production
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: rebuild site at ${{ github.sha }}" || echo "No changes to commit"
          git push origin production

name: CI on Testing

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NUXT_APP_BASE_URL: /

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.13'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (static)
        run: npm run build:prod
